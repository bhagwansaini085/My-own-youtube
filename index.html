var SYN={sst:['social science','sst','samajik'],sci:['science','vigyan'],math:['math','maths','ganit'],maths:['math','maths','ganit'],ganit:['math','maths','ganit'],eng:['english'],gk:['gk','general knowledge'],marathon:['marathon','revision','one shot','oneshot'],revision:['revision','marathon','one shot'],pyq:['pyq','previous year'],mcq:['mcq','objective'],physics:['physics','bhautik'],chemistry:['chemistry','rasayan'],bio:['bio','biology']};
var STOP={ke:1,ki:1,ka:1,me:1,mein:1,liye:1,for:1,of:1,the:1,and:1,aur:1,ko:1,se:1,video:1,videos:1,wala:1,wali:1,'in':1,on:1,a:1};
var NT={};
function norm(s){return String(s).toLowerCase().replace(/(\d+)(th|st|nd|rd)\b/g,'$1').replace(/[^a-z0-9\u0900-\u097f]+/g,' ').replace(/\s+/g,' ').trim()}
function rank(a,q){
 var tk=norm(q).split(' ').filter(function(w){return w&&!STOP[w]});
 if(!tk.length)return a;
 var need=tk.length<=2?tk.length:Math.ceil(tk.length*0.7),out=[];
 a.forEach(function(x){
  var h=NT[x.id]||(NT[x.id]=' '+norm(x.t+' '+x.cn)+' '),s=0;
  tk.forEach(function(t){var ok=false;(SYN[t]||[t]).forEach(function(w){if(/^\d+$/.test(w)?h.indexOf(' '+w+' ')>-1:h.indexOf(w)>-1)ok=true});if(ok)s++});
  if(s>=need)out.push({x:x,s:s});
 });
 out.sort(function(p,r){return r.s-p.s||(p.x.d<r.x.d?1:-1)});
 return out.map(function(o){return o.x});
}
function cardH(x,i){
 var d=dur(x.du),v=x.vw?nf(x.vw)+' · ':'';
 return'<div class="card fx" tabindex="0" data-i="'+i+'"><div class="th"><img loading="lazy" src="'+thumb(x.id)+'" data-f="'+thumb2(x.id)+'" onerror="tf(this)" onload="tf(this)" alt="">'+(d?'<span class="du">'+d+'</span>':'')+'</div><div class="mt">'+avh(x)+'<div><div class="tt">'+esc(x.t)+'</div><div class="sub"><span class="cl" data-ch="'+x.c+'">'+esc(x.cn)+'</span><br>'+v+ago(x.d)+'</div></div></div></div>';
}
function drawGrid(){
 var q=Q,a=SEL?((q&&DEEP.length)?DEEP:SV):OV,h='',tail='';
 if(SEL){a=a.filter(function(x){return!ACT||x.c===ACT});if(q)a=rank(a,q)}
 VIEW=a;
 if(SEL&&q&&!DEEP.length&&KEY)tail='<div style="width:100%"><div class="more fx" tabindex="0" id="deep" style="width:auto;margin:6px 14px 16px">Aur purane videos me bhi dhundho (~150 quota, ek baar)</div></div>';
 if(!VIEW.length){$('grid').innerHTML='<div class="msg">'+(SEL&&(q||ACT)?'Is search/channel me koi video nahi mila.':'Koi video nahi mila.')+'</div>'+tail;return}
 VIEW.slice(0,SHOW).forEach(function(x,i){h+=cardH(x,i)});
 if(VIEW.length>SHOW)h+='<div style="width:100%"><div class="more fx" tabindex="0" id="more">Aur dikhao</div></div>';
 $('grid').innerHTML=h+tail;
}
function deepLoad(){
 var list=[],seen={};
 CH.forEach(function(s){var r=RES[s];if(r&&r.id&&!seen[r.id]){seen[r.id]=1;list.push(r)}});
 msg('Poori history load ho rahi hai… 1-2 minute lag sakte hain.');
 Promise.all(list.map(function(r){
  var out=[];
  function pg(tok,n){
   var p={part:'snippet,contentDetails',playlistId:'UU'+r.id.slice(2),maxResults:50};if(tok)p.pageToken=tok;
   return api('playlistItems',p).then(function(j){
    (j.items||[]).forEach(function(i){var t=i.snippet.title;if(t!=='Private video'&&t!=='Deleted video')out.push({id:i.contentDetails.videoId,t:t,c:r.id,cn:r.title,d:i.contentDetails.videoPublishedAt||i.snippet.publishedAt})});
    return j.nextPageToken&&n<4?pg(j.nextPageToken,n+1):out});
  }
  return pg('',0).catch(function(e){if(fatal(e))throw e;return out});
 })).then(function(a){var v=[].concat.apply([],a);v.sort(function(x,y){return x.d<y.d?1:-1});return details(v)}).then(function(v){DEEP=v;sv('mc_deep',{t:Date.now(),sig:'v2|'+CH.join('|'),v:v});drawGrid()}).catch(function(e){msg('Error: '+emsg(e))});
}
function drawCh(){
 var q=$('chf').value,a=q?rank(CV,q):CV,h='';
 CVIEW=a;
 a.forEach(function(x,i){h+=cardH(x,i)});
 if(!a.length)h='<div class="msg">Koi video nahi mila.</div>';
 else if(CPT&&!q)h+='<div style="width:100%"><div class="more fx" tabindex="0">Aur dikhao</div></div>';
 $('chg').innerHTML=h;
}
function chMore(){
 var id=CHID,p={part:'snippet,contentDetails',playlistId:'UU'+id.slice(2),maxResults:30};if(CPT)p.pageToken=CPT;
 return api('playlistItems',p).then(function(j){
  CPT=j.nextPageToken||'';
  var v=(j.items||[]).filter(function(i){var t=i.snippet.title;return t!=='Private video'&&t!=='Deleted video'}).map(function(i){return{id:i.contentDetails.videoId,t:i.snippet.title,c:id,cn:CNAME,d:i.contentDetails.videoPublishedAt||i.snippet.publishedAt}});
  return details(v)}).then(function(v){if(CHID!==id)return;CV=CV.concat(v);drawCh()});
}
function openCh(id){
 if(!id||!KEY)return;
 if(openOv()==='pl')hide('pl');
 CHID=id;CV=[];CPT='';$('chf').value='';
 $('chh').innerHTML='<div class="msg">Load ho raha hai…</div>';$('chg').innerHTML='';
 show('ch');$('ch').scrollTop=0;
 api('channels',{part:'snippet,statistics,brandingSettings',id:id}).then(function(j){
  var c=j.items&&j.items[0];if(!c||CHID!==id){if(!c)$('chh').innerHTML='<div class="msg">Channel nahi mila.</div>';return}
  CNAME=c.snippet.title;
  var st=c.statistics||{},b=c.brandingSettings&&c.brandingSettings.image&&c.brandingSettings.image.bannerExternalUrl,th=c.snippet.thumbnails||{};CTH=(th.medium||th['default']||{}).url||'';
  $('chh').innerHTML=(b?'<div class="cb" style="background-image:url('+esc(b)+'=w1280)"></div>':'')+'<div class="ch1"><img class="cav" src="'+esc((th.medium||th['default']||{}).url||'')+'" alt=""><div><div class="cn">'+esc(c.snippet.title)+'</div><div class="cm">'+esc(c.snippet.customUrl||'')+(st.hiddenSubscriberCount?'':' · '+nn(st.subscriberCount)+' subscribers')+' · '+nn(st.videoCount)+' videos</div><div style="margin-top:8px">'+sbH(id)+'</div></div></div>'+(c.snippet.description?'<div class="vd fx" tabindex="0" style="margin:0 14px 8px">'+esc(c.snippet.description)+'</div>':'');
  return chMore();
 }).catch(function(e){$('chh').innerHTML='<div class="msg">Error: '+esc(emsg(e))+'</div>'});
}
function ui(){
 $('mode').checked=SEL;
 $('q').placeholder=SEL?'Mere channels me search karo':'YouTube pe search karo';
 $('hint').textContent=SEL?'ON: sirf aapke chosen channels. Search bhi inhi videos me hota hai (free). Poore YouTube ke liye switch OFF karo.':'';
}
function refresh(force){
 chips();
 if(!KEY){msg('Pehle ⚙ Settings me apni YouTube API key daalo.');return}
 var tk=++TK;msg('Load ho raha hai…');
 var p=SEL?loadSel(force):loadAll(OQ,force);
 p.then(function(){if(tk!==TK)return;SHOW=36;chips();drawGrid()}).catch(function(e){if(tk===TK)msg('Error: '+emsg(e))});

var OVS=['pl','ch','st'];
function openOv(){for(var i=0;i<OVS.length;i++)if($(OVS[i]).className.indexOf('show')>-1)return OVS[i];return''}
function show(id){LF=document.activeElement;$(id).className='ov show';var f=$(id).querySelector('.fx');if(f&&TV)f.focus()}
function hide(id){$(id).className='ov';if(id==='pl'){$('vp').innerHTML='';PL=null}if(LF&&LF.focus)try{LF.focus()}catch(e){}}
var DC={},PL=null,NX=null,RLIST=[],LP=0;
function avh(x){var a=x.av||avOf(x.c);return a?'<img class="av cl" data-ch="'+x.c+'" src="'+esc(a)+'" alt="">':'<div class="av cl" data-ch="'+x.c+'">'+esc((x.cn||'?').charAt(0).toUpperCase())+'</div>'}
function vinfo(x,d){
 var v=d.v||x.vw;
 $('vi').innerHTML='<div class="vt">'+esc(x.t)+'</div><div class="vm">'+(v?nf(v)+' · ':'')+ago(x.d)+'</div><div class="vc">'+avh(x)+'<b class="cl" data-ch="'+x.c+'">'+esc(x.cn)+'</b>'+sbH(x.c)+(d.l?'<span class="lk">&#128077; '+nf(d.l).replace(' views','')+'</span>':'')+'</div>'+(d.d?'<div class="vd fx" tabindex="0" id="vd">'+esc(d.d)+'</div>':'');
}
function play(x){
 PL=x;LP=Date.now();
 $('vp').innerHTML='<iframe id="vf" src="https://www.youtube-nocookie.com/embed/'+x.id+'?autoplay=1&rel=0&playsinline=1&enablejsapi=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
 var f=$('vf');f.onload=function(){try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(e){}};
 vinfo(x,DC[x.id]||{});
 if(!DC[x.id]&&KEY)api('videos',{part:'snippet,statistics',id:x.id}).then(function(j){var i=j.items&&j.items[0];if(i){DC[x.id]={d:i.snippet.description,l:i.statistics.likeCount,v:i.statistics.viewCount};if(PL===x)vinfo(x,DC[x.id])}}).catch(function(){});
 var a=PCTX.length?PCTX:(SEL?SV:OV),i=-1,k;
 for(k=0;k<a.length;k++)if(a[k].id===x.id){i=k;break}
 RLIST=a.slice(i+1).concat(a.slice(0,i<0?0:i)).filter(function(y){return y.id!==x.id}).slice(0,25);
 NX=RLIST[0]||null;
 var h=RLIST.length?'<div class="nx">Aage ke videos</div>':'';
 RLIST.forEach(function(y,j){var d=dur(y.du);h+='<div class="rw fx" tabindex="0" data-j="'+j+'"><div class="rt"><div class="th"><img src="'+thumb2(y.id)+'" alt="">'+(d?'<span class="du">'+d+'</span>':'')+'</div></div><div><div class="tt">'+esc(y.t)+'</div><div class="sub">'+esc(y.cn)+'<br>'+(y.vw?nf(y.vw)+' · ':'')+ago(y.d)+'</div></div></div>'});
 $('rl').innerHTML=h;
 if($('pl').className.indexOf('show')<0)show('pl');
 $('pl').scrollTop=0;
}
function stat(){
 var cnt={},h='';
 SV.forEach(function(x){cnt[x.c]=(cnt[x.c]||0)+1});
 CH.forEach(function(s){
  var r=RES[s],e=ST[s]||(r&&ST[r.id]);
  if(r&&r.id&&!e)h+='<div class="sr">✅ '+esc(r.title)+' <span>('+(cnt[r.id]||0)+' videos)</span></div>';
  else h+='<div class="sr">❌ '+esc(s)+' <span>'+esc(e||'abhi load nahi hua')+'</span></div>';
 });
 $('ss').innerHTML=h||'<div class="sr"><span>Koi channel nahi</span></div>';
}
function lines(){var seen={},a=[];$('ci').value.split(/\r?\n/).forEach(function(s){s=s.trim();if(s&&!seen[s]){seen[s]=1;a.push(s)}});return a}

 SEL=this.checked;sv('mc_mode',SEL);Q='';OQ='';ACT='';$('q').value='';ui();refresh(false);

 KEY=$('ki').value.trim();CH=lines();sv('mc_key',KEY);sv('mc_ch',CH);

 var i=$('sl');i.style.display='block';i.value=u;i.focus();i.select();

$('q').addEventListener('input',function(){if(SEL){Q=this.value;SHOW=36;drawGrid()}});
$('sf').addEventListener('submit',function(e){
 e.preventDefault();
 var v=$('q').value.trim();
 if(SEL){Q=v;SHOW=36;drawGrid();$('q').blur()}
 else{OQ=v;refresh(true);$('q').blur()}
});
$('chips').addEventListener('click',function(e){
 var c=up(e.target,'chip');if(!c)return;
 ACT=c.getAttribute('data-c');SHOW=36;chips();drawGrid();
 var n=document.querySelectorAll('.chip');for(var i=0;i<n.length;i++)if(n[i].getAttribute('data-c')===ACT){if(TV)n[i].focus();break}
});
$('grid').addEventListener('click',function(e){
 var m=up(e.target,'more');
 if(m&&m.id==='deep'){deepLoad();return}
 var l=up(e.target,'cl');if(l){openCh(l.getAttribute('data-ch'));return}
 if(m){var n=SHOW;SHOW+=36;drawGrid();var cs=document.querySelectorAll('.card');if(TV&&cs[n])cs[n].focus();return}
 var c=up(e.target,'card');if(c){var x=VIEW[+c.getAttribute('data-i')];if(x){PCTX=VIEW;play(x)}}

window.addEventListener('message',function(e){
 if(!PL||!NX||!/youtube/.test(e.origin||''))return;
 try{
  var m=typeof e.data==='string'?JSON.parse(e.data):e.data;
  var end=m&&((m.event==='onStateChange'&&m.info===0)||(m.event==='infoDelivery'&&m.info&&m.info.playerState===0));
  if(end&&Date.now()-LP>4000)play(NX);
 }catch(x){}
});
function nav(k,e){
 var o=openOv(),root=o?$(o):document;
 var els=[].slice.call(root.querySelectorAll('.fx')).filter(function(x){return x.offsetWidth>0});
 var a=document.activeElement,cur=a&&up(a,'fx');
 if(!cur){if(els[0]){els[0].focus();e.preventDefault()}return}
 var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bd=1e9;
 els.forEach(function(x){
  if(x===cur)return;
  var b=x.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy,ok,p,q;
  if(k===37){ok=dx<-2;p=-dx;q=Math.abs(dy)}else if(k===39){ok=dx>2;p=dx;q=Math.abs(dy)}else if(k===38){ok=dy<-2;p=-dy;q=Math.abs(dx)}else{ok=dy>2;p=dy;q=Math.abs(dx)}
  if(!ok)return;
  var d=p+q*2.5;if(d<bd){bd=d;best=x}
 });
 if(best){best.focus();e.preventDefault()}
}
document.addEventListener('keydown',function(e){
 var k=e.keyCode,t=e.target,tag=t&&t.tagName||'',inp=/INPUT|TEXTAREA/.test(tag),o=openOv();
 if(k===27||k===461||k===10009||k===4||(k===8&&!inp)){if(o){hide(o);e.preventDefault()}return}
 if(k===13&&t&&t.className&&String(t.className).indexOf('fx')>-1&&!/INPUT|TEXTAREA|BUTTON|^A$/.test(tag)){t.click();e.preventDefault();return}
 if(TV&&k>=37&&k<=40){if(inp&&(k===37||k===39))return;nav(k,e)}
});

 var c=up(e.target,'card');if(c){var x=CVIEW[+c.getAttribute('data-i')];if(x){PCTX=CVIEW;play(x)}}

(function(){var d=ld('mc_deep',null);if(d&&Date.now()-d.t<864e5&&d.sig==='v2|'+CH.join('|'))DEEP=d.v})();

ui();refresh(false);
})();
